name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Only whether the key is set; the key itself is passed to the push step alone, so the test and pack steps
      # (which run third-party MSBuild targets) never see it.
      HAS_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Cavok.sln --configuration Release

      - name: Pack
        run: dotnet pack src/Cavok/Cavok.csproj --configuration Release --output artifacts -p:Version="$VERSION"

      # Trusted publishing (no stored key) needs a one-time policy on nuget.org for this repository and
      # workflow, and the nuget.org user name in the NUGET_USER secret. A NUGET_API_KEY secret is used instead
      # when it is set.
      - name: NuGet login
        id: login
        if: env.HAS_NUGET_API_KEY != 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${NUGET_API_KEY:-$LOGIN_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          LOGIN_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
